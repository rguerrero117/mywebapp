<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
</head>
<body>
    <script>
        "use script";
        // get meal cost and tip percentage from user
        const mealCost = parseFloat(prompt("Enter Meal Cost"));
        const tipPercent = parseFloat(prompt("Enter Tip Percent: "));

        // calculate tip amount and total cost
        const tipAmount = mealCost * (tipPercent / 100);
        const totalCost = mealCost + tipAmount;

        // display results - round dollar amounts to 2 decimal places, percent to 0 decimal places
        let response = `Meal cost: $${mealCost.toFixed(2)}\n`;
        response += `Tip percent: ${tipPercent.toFixed(0)}%\n`;
        response += `Tip amount: $${tipAmount.toFixed(2)}\n`;
        response += `Total cost: $${totalCost.toFixed(2)}`;
    alert(response);
    </script>
</body>
</html>
